<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konomi Games - 3D Interactive Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #0f3460);
            color: #00ff88;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #00ff88;
        }

        .header h1 {
            font-size: 48px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            color: #88ff88;
            margin-top: 10px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .game-card {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .game-card:hover {
            background: rgba(0, 255, 136, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
            border-width: 3px;
        }

        .game-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
            text-align: center;
        }

        .game-name {
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
            text-align: center;
        }

        .game-desc {
            font-size: 12px;
            color: #88ff88;
            text-align: center;
            line-height: 1.5;
        }

        .stats {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 20, 40, 0.9);
            border: 2px solid #00ff88;
            border-radius: 12px;
            max-width: 600px;
            margin: 40px auto 0;
        }

        .stats-content {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 KONOMI GAMES</h1>
        <p>3D Interactive Game Gallery</p>
        <p style="font-size: 12px; margin-top: 15px;">Powered by Three.js - Click any game to play!</p>
    </div>

    <div class="game-grid" id="gameGrid">
        <!-- Games will be loaded here -->
    </div>

    <div class="stats">
        <div class="stats-content">
            <strong>Total Games: <span id="gameCount">21</span></strong><br>
            <small style="color: #88ff88; margin-top: 10px; display: block;">
                All games are browser-based and require no installation!
            </small>
        </div>
    </div>

    <script>
        const games = [
            {
                id: 'cube-spinner',
                name: 'Cube Spinner',
                icon: '🎲',
                desc: 'Interactive rotating cube with mouse control',
                file: 'cube-spinner.html'
            },
            {
                id: 'particle-system',
                name: 'Particle Storm',
                icon: '✨',
                desc: 'Interactive particle system with physics',
                file: 'particle-system.html'
            },
            {
                id: 'space-shooter',
                name: 'Space Shooter',
                icon: '🚀',
                desc: 'Classic space shooter in 3D',
                file: 'space-shooter.html'
            },
            {
                id: 'terrain-explorer',
                name: 'Terrain Explorer',
                icon: '🏔️',
                desc: 'Navigate procedural 3D terrain',
                file: 'terrain-explorer.html'
            },
            {
                id: 'neural-network-viz',
                name: 'Neural Network',
                icon: '🧠',
                desc: 'Visualize AI neural network training',
                file: 'neural-network-viz.html'
            },
            {
                id: 'block-breaker',
                name: 'Block Breaker 3D',
                icon: '🧱',
                desc: 'Break blocks in 3D space',
                file: 'block-breaker.html'
            },
            {
                id: 'fractal-explorer',
                name: 'Fractal Explorer',
                icon: '🌀',
                desc: 'Explore infinite fractal patterns',
                file: 'fractal-explorer.html'
            },
            {
                id: 'konomi-os',
                name: 'Konomi OS',
                icon: '🖥️',
                desc: 'Full 3D Operating System with AI',
                file: 'konomi-os.html'
            },
            {
                id: 'maze-runner',
                name: 'Maze Runner',
                icon: '🧭',
                desc: 'First-person procedural maze exploration',
                file: 'maze-runner.html'
            },
            {
                id: 'tower-defense',
                name: 'Tower Defense',
                icon: '⚔️',
                desc: 'Strategic 3D tower defense with waves',
                file: 'tower-defense.html'
            },
            {
                id: 'physics-sandbox',
                name: 'Physics Sandbox',
                icon: '🎮',
                desc: 'Interactive physics playground',
                file: 'physics-sandbox.html'
            },
            {
                id: 'neon-racer',
                name: 'Neon Racer',
                icon: '🏎️',
                desc: 'Futuristic high-speed racing game',
                file: 'neon-racer.html'
            },
            {
                id: 'music-visualizer',
                name: 'Music Visualizer',
                icon: '🎵',
                desc: 'Audio-reactive 3D visualization',
                file: 'music-visualizer.html'
            },
            {
                id: 'city-builder',
                name: 'City Builder',
                icon: '🏙️',
                desc: 'Build and manage your 3D city',
                file: 'city-builder.html'
            },
            {
                id: 'api-hero',
                name: 'API Hero',
                icon: '🎸',
                desc: 'Guitar Hero with auto-generated notes from audio',
                file: 'api-hero.html'
            },
            {
                id: 'platformer-3d',
                name: '3D Platformer',
                icon: '🏃',
                desc: 'Fast-paced platforming with obstacles and coins',
                file: 'platformer-3d.html'
            },
            {
                id: 'block-stacker',
                name: 'Block Stacker 3D',
                icon: '🧩',
                desc: 'Tetris-inspired 3D puzzle game',
                file: 'block-stacker.html'
            },
            {
                id: 'sky-combat',
                name: 'Sky Combat',
                icon: '✈️',
                desc: 'Aerial dogfight shooter with missiles',
                file: 'sky-combat.html'
            },
            {
                id: 'zen-garden',
                name: 'Zen Garden',
                icon: '🏯',
                desc: 'Relaxing zen garden builder',
                file: 'zen-garden.html'
            },
            {
                id: 'dungeon-crawler',
                name: 'Dungeon Crawler',
                icon: '⚔️',
                desc: 'Procedural dungeon exploration with combat',
                file: 'dungeon-crawler.html'
            },
            {
                id: 'portal-puzzle',
                name: 'Portal Puzzle',
                icon: '🌀',
                desc: 'Portal-based physics puzzle game',
                file: 'portal-puzzle.html'
            }
        ];

        // Load game grid
        const gameGrid = document.getElementById('gameGrid');

        games.forEach(game => {
            const card = document.createElement('a');
            card.href = game.file;
            card.className = 'game-card';
            card.innerHTML = `
                <span class="game-icon">${game.icon}</span>
                <div class="game-name">${game.name}</div>
                <div class="game-desc">${game.desc}</div>
            `;
            gameGrid.appendChild(card);
        });

        // Update game count
        document.getElementById('gameCount').textContent = games.length;
    </script>
</body>
</html>
