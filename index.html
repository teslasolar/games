<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konomi Games - 3D Interactive Gallery</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Courier New',monospace;background:linear-gradient(135deg,#0a0a0a,#1a1a2e,#0f3460);color:#0f8;overflow:hidden}
        .container{display:flex;height:100vh}
        .sidebar{width:300px;background:rgba(0,20,40,.95);border-right:2px solid #0f8;padding:20px;overflow-y:auto;backdrop-filter:blur(10px)}
        .header{text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #0f8}
        .header h1{font-size:24px;text-shadow:0 0 10px rgba(0,255,136,.5)}
        .header p{font-size:10px;color:#8f8;margin-top:5px}
        .filter{margin-bottom:15px}
        .filter select{width:100%;background:rgba(0,40,60,.8);border:1px solid #0f8;color:#0f8;padding:8px;border-radius:6px;font-family:inherit}
        .game-list{list-style:none}
        .game-item{background:rgba(0,255,136,.1);border:1px solid #0f8;border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;transition:all .3s}
        .game-item:hover{background:rgba(0,255,136,.2);transform:translateX(5px);box-shadow:0 0 15px rgba(0,255,136,.3)}
        .game-item.active{background:rgba(0,255,136,.3);border-width:2px;box-shadow:0 0 20px rgba(0,255,136,.5)}
        .game-icon{font-size:20px;margin-right:8px}
        .game-name{font-weight:bold;font-size:14px}
        .game-desc{font-size:9px;color:#8f8;margin-top:4px}
        .game-cat{font-size:8px;color:#0ff;margin-top:2px}
        .content{flex:1;position:relative}
        .game-frame{width:100%;height:100%;border:none;display:none}
        .game-frame.active{display:block}
        .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:20px}
        .spinner{border:4px solid rgba(0,255,136,.1);border-top:4px solid #0f8;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin:20px auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .stats{position:absolute;bottom:10px;left:310px;background:rgba(0,20,40,.9);border:1px solid #0f8;border-radius:8px;padding:8px 12px;font-size:10px;backdrop-filter:blur(5px)}
        .fullscreen-btn{position:absolute;top:10px;right:10px;background:rgba(0,255,136,.2);border:2px solid #0f8;border-radius:8px;padding:10px 15px;color:#0f8;cursor:pointer;font-family:inherit;font-size:12px;transition:all .3s;z-index:1000}
        .fullscreen-btn:hover{background:rgba(0,255,136,.4);box-shadow:0 0 15px rgba(0,255,136,.5)}
        ::-webkit-scrollbar{width:8px}
        ::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
        ::-webkit-scrollbar-thumb{background:#0f8;border-radius:4px}
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>🎮 KONOMI GAMES</h1>
                <p>3D Interactive Gallery</p>
                <p style="font-size:8px;margin-top:10px">Auto-loaded from games.json</p>
            </div>
            <div class="filter">
                <select id="categoryFilter"><option value="">All Categories</option></select>
            </div>
            <ul class="game-list" id="gameList"></ul>
        </div>
        <div class="content" id="content">
            <div class="loading" id="loading"><div class="spinner"></div>Loading Games...</div>
            <button class="fullscreen-btn" id="fullscreenBtn" style="display:none">🖵 Fullscreen</button>
            <div class="stats" id="stats" style="display:none"><span id="statsText">Loading...</span></div>
        </div>
    </div>
    <script>
    const G={
        games:[],current:null,filter:'',
        async init(){
            try{
                const r=await fetch('games.json');
                const d=await r.json();
                this.games=d.games.map(g=>({...g,file:`${g.id}/index.html`}));
                this.loadCategories(d.categories||[]);
                this.render();
                this.events();
                if(this.games.length)setTimeout(()=>this.load(this.games[0]),300);
            }catch(e){console.error('Failed to load games.json:',e);this.fallback()}
        },
        fallback(){
            // Fallback: scan for game directories
            const known=['cube-spinner','particle-system','space-shooter','terrain-explorer','neural-network-viz','block-breaker','fractal-explorer','konomi-os','maze-runner','tower-defense','physics-sandbox','neon-racer','music-visualizer','particle-song-generator','city-builder'];
            this.games=known.map(id=>({id,name:id.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' '),icon:'🎮',desc:'3D Game',file:`${id}/index.html`,category:'game'}));
            this.render();
            if(this.games.length)setTimeout(()=>this.load(this.games[0]),300);
        },
        loadCategories(cats){
            const sel=document.getElementById('categoryFilter');
            cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c[0].toUpperCase()+c.slice(1);sel.appendChild(o)});
            sel.onchange=e=>{this.filter=e.target.value;this.render()};
        },
        render(){
            const list=document.getElementById('gameList');
            list.innerHTML='';
            this.games.filter(g=>!this.filter||g.category===this.filter).forEach(g=>{
                const li=document.createElement('li');
                li.className='game-item'+(this.current?.id===g.id?' active':'');
                li.dataset.id=g.id;
                li.innerHTML=`<div><span class="game-icon">${g.icon}</span><span class="game-name">${g.name}</span></div><div class="game-desc">${g.desc}</div><div class="game-cat">[${g.category}]</div>`;
                li.onclick=()=>this.load(g);
                list.appendChild(li);
            });
        },
        load(g){
            document.getElementById('loading').style.display='block';
            document.getElementById('fullscreenBtn').style.display='none';
            document.getElementById('stats').style.display='none';
            this.current=g;
            this.render();
            const c=document.getElementById('content');
            c.querySelectorAll('.game-frame').forEach(f=>f.remove());
            const iframe=document.createElement('iframe');
            iframe.className='game-frame active';
            iframe.src=g.file;
            iframe.sandbox='allow-scripts allow-same-origin';
            iframe.onload=()=>{
                document.getElementById('loading').style.display='none';
                document.getElementById('fullscreenBtn').style.display='block';
                document.getElementById('stats').style.display='block';
                document.getElementById('statsText').innerHTML=`<strong>${g.icon} ${g.name}</strong> [${g.category}]<br>${g.desc}<br><small style="color:#8f8">Path: ${g.file}</small>`;
            };
            c.appendChild(iframe);
        },
        events(){
            document.getElementById('fullscreenBtn').onclick=()=>{
                const f=document.querySelector('.game-frame.active');
                if(f)(f.requestFullscreen||f.webkitRequestFullscreen||f.msRequestFullscreen).call(f);
            };
            document.onkeydown=e=>{
                if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen();
                if(['ArrowLeft','ArrowUp','ArrowDown','ArrowRight'].includes(e.key)){
                    e.preventDefault();
                    const dir=e.key.includes('Left')||e.key.includes('Up')?-1:1;
                    const visible=this.games.filter(g=>!this.filter||g.category===this.filter);
                    const idx=visible.findIndex(g=>g.id===this.current?.id);
                    if(idx>-1)this.load(visible[(idx+dir+visible.length)%visible.length]);
                }
            };
        }
    };
    addEventListener('load',()=>G.init());
    </script>
</body>
</html>
