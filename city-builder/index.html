<!DOCTYPE html>
<html>
<head>
    <title>City Builder 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff88;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        .resource {
            margin: 5px 0;
            font-size: 12px;
        }
        #buildings {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 100;
        }
        .building-btn {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            transition: all 0.3s;
            text-align: center;
        }
        .building-btn:hover {
            background: rgba(0, 255, 136, 0.4);
            transform: translateY(-2px);
        }
        .building-btn.active {
            background: rgba(0, 255, 136, 0.6);
            border-width: 3px;
        }
        .building-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .cost {
            font-size: 9px;
            color: #88ff88;
        }
        #info {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #00ff88;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            max-width: 200px;
        }
        .hint {
            font-size: 10px;
            color: #88ff88;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div style="font-size: 16px; margin-bottom: 10px;">🏙️ CITY BUILDER</div>
        <div class="resource">💰 Money: <span id="money">1000</span></div>
        <div class="resource">👥 Population: <span id="population">0</span></div>
        <div class="resource">🏭 Industry: <span id="industry">0</span></div>
        <div class="resource">⚡ Power: <span id="power">0</span>/<span id="powerNeed">0</span></div>
        <div class="resource">😊 Happiness: <span id="happiness">100</span>%</div>
    </div>

    <div id="info">
        <div style="font-weight: bold; margin-bottom: 5px;">Controls:</div>
        <div class="hint">🖱️ Click: Place building</div>
        <div class="hint">🗑️ Right-click: Remove</div>
        <div class="hint">🔄 Mouse: Rotate view</div>
        <div class="hint">🔍 Wheel: Zoom</div>
        <div style="margin-top: 10px; font-size: 10px;">Buildings: <span id="buildingCount">0</span>/100</div>
    </div>

    <div id="buildings">
        <button class="building-btn" data-type="house" data-cost="100">
            🏠 House<br><span class="cost">$100 | +5👥</span>
        </button>
        <button class="building-btn" data-type="apartment" data-cost="300">
            🏢 Apartment<br><span class="cost">$300 | +20👥</span>
        </button>
        <button class="building-btn" data-type="factory" data-cost="500">
            🏭 Factory<br><span class="cost">$500 | +$50/s</span>
        </button>
        <button class="building-btn" data-type="office" data-cost="400">
            🏛️ Office<br><span class="cost">$400 | +$30/s</span>
        </button>
        <button class="building-btn" data-type="power" data-cost="600">
            ⚡ Power Plant<br><span class="cost">$600 | +100⚡</span>
        </button>
        <button class="building-btn" data-type="park" data-cost="200">
            🌳 Park<br><span class="cost">$200 | +10😊</span>
        </button>
        <button class="building-btn" data-type="shop" data-cost="250">
            🏪 Shop<br><span class="cost">$250 | +$20/s</span>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 40, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 50, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Ground
        const gridSize = 40;
        const grid = [];

        for (let x = 0; x < gridSize; x++) {
            grid[x] = [];
            for (let z = 0; z < gridSize; z++) {
                const geometry = new THREE.PlaneGeometry(1, 1);
                const isEven = (x + z) % 2 === 0;
                const material = new THREE.MeshPhongMaterial({
                    color: isEven ? 0x2d5016 : 0x3a6018,
                    side: THREE.DoubleSide
                });
                const tile = new THREE.Mesh(geometry, material);
                tile.rotation.x = -Math.PI / 2;
                tile.position.set(x - gridSize / 2, 0, z - gridSize / 2);
                tile.receiveShadow = true;
                scene.add(tile);
                grid[x][z] = { tile, building: null };
            }
        }

        // Game state
        const gameState = {
            money: 1000,
            population: 0,
            industry: 0,
            power: 0,
            powerNeed: 0,
            happiness: 100,
            selectedBuilding: null,
            buildings: []
        };

        // Building types
        const buildingTypes = {
            house: {
                color: 0xff6b6b,
                height: 2,
                population: 5,
                powerNeed: 2,
                income: 5
            },
            apartment: {
                color: 0x4ecdc4,
                height: 5,
                population: 20,
                powerNeed: 10,
                income: 15
            },
            factory: {
                color: 0x95a5a6,
                height: 4,
                population: 0,
                powerNeed: 20,
                income: 50
            },
            office: {
                color: 0x3498db,
                height: 6,
                population: 0,
                powerNeed: 15,
                income: 30
            },
            power: {
                color: 0xf39c12,
                height: 3,
                population: 0,
                powerNeed: 0,
                income: -10,
                powerGen: 100
            },
            park: {
                color: 0x27ae60,
                height: 0.5,
                population: 0,
                powerNeed: 1,
                income: -5,
                happiness: 10
            },
            shop: {
                color: 0xe74c3c,
                height: 2.5,
                population: 0,
                powerNeed: 5,
                income: 20
            }
        };

        class Building {
            constructor(type, gridX, gridZ) {
                this.type = type;
                this.stats = buildingTypes[type];
                this.gridX = gridX;
                this.gridZ = gridZ;

                // Create building mesh
                const geometry = new THREE.BoxGeometry(0.9, this.stats.height, 0.9);
                const material = new THREE.MeshPhongMaterial({ color: this.stats.color });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.set(
                    gridX - gridSize / 2,
                    this.stats.height / 2,
                    gridZ - gridSize / 2
                );
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                scene.add(this.mesh);

                // Add to game state
                gameState.population += this.stats.population || 0;
                gameState.industry += this.stats.income || 0;
                gameState.powerNeed += this.stats.powerNeed || 0;
                gameState.power += this.stats.powerGen || 0;
                gameState.happiness += this.stats.happiness || 0;
                gameState.buildings.push(this);

                // Mark grid as occupied
                grid[gridX][gridZ].building = this;

                // Animation
                this.mesh.scale.y = 0;
                this.targetScale = 1;
            }

            update() {
                // Grow animation
                if (this.mesh.scale.y < this.targetScale) {
                    this.mesh.scale.y = Math.min(this.mesh.scale.y + 0.05, this.targetScale);
                    this.mesh.position.y = (this.stats.height / 2) * this.mesh.scale.y;
                }

                // Bounce animation
                this.mesh.rotation.y += 0.001;
            }

            remove() {
                scene.remove(this.mesh);
                gameState.population -= this.stats.population || 0;
                gameState.industry -= this.stats.income || 0;
                gameState.powerNeed -= this.stats.powerNeed || 0;
                gameState.power -= this.stats.powerGen || 0;
                gameState.happiness -= this.stats.happiness || 0;
                grid[this.gridX][this.gridZ].building = null;

                const idx = gameState.buildings.indexOf(this);
                if (idx > -1) gameState.buildings.splice(idx, 1);
            }
        }

        // Mouse interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredTile = null;

        renderer.domElement.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children.filter(obj =>
                obj.geometry && obj.geometry.type === 'PlaneGeometry'
            ));

            // Reset previous hover
            if (hoveredTile) {
                const isEven = (hoveredTile.x + hoveredTile.z) % 2 === 0;
                hoveredTile.tile.material.color.setHex(isEven ? 0x2d5016 : 0x3a6018);
                hoveredTile = null;
            }

            if (intersects.length > 0) {
                const pos = intersects[0].object.position;
                const gridX = Math.floor(pos.x + gridSize / 2);
                const gridZ = Math.floor(pos.z + gridSize / 2);

                if (gridX >= 0 && gridX < gridSize && gridZ >= 0 && gridZ < gridSize) {
                    hoveredTile = { x: gridX, z: gridZ, tile: grid[gridX][gridZ].tile };
                    hoveredTile.tile.material.color.setHex(0xffff88);
                }
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (hoveredTile && gameState.selectedBuilding) {
                const { x, z } = hoveredTile;

                if (!grid[x][z].building) {
                    const btn = document.querySelector(`[data-type="${gameState.selectedBuilding}"]`);
                    const cost = parseInt(btn.dataset.cost);

                    if (gameState.money >= cost && gameState.buildings.length < 100) {
                        new Building(gameState.selectedBuilding, x, z);
                        gameState.money -= cost;
                        updateHUD();
                    }
                }
            }
        });

        renderer.domElement.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (hoveredTile) {
                const building = grid[hoveredTile.x][hoveredTile.z].building;
                if (building) {
                    const btn = document.querySelector(`[data-type="${building.type}"]`);
                    const refund = parseInt(btn.dataset.cost) * 0.5;
                    gameState.money += refund;
                    building.remove();
                    updateHUD();
                }
            }
        });

        // Building selection
        document.querySelectorAll('.building-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cost = parseInt(btn.dataset.cost);
                if (gameState.money >= cost && gameState.buildings.length < 100) {
                    document.querySelectorAll('.building-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.selectedBuilding = btn.dataset.type;
                }
            });
        });

        // Camera controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraAngle = Math.PI / 4;
        let cameraDistance = 50;

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 1) { // Middle mouse button
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                cameraAngle -= deltaX * 0.01;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            cameraDistance = Math.max(20, Math.min(80, cameraDistance + e.deltaY * 0.05));
        });

        // Income generation
        setInterval(() => {
            if (gameState.power >= gameState.powerNeed) {
                gameState.money += gameState.industry / 10;
            } else {
                gameState.happiness = Math.max(0, gameState.happiness - 1);
            }
            updateHUD();
        }, 1000);

        function updateHUD() {
            document.getElementById('money').textContent = Math.floor(gameState.money);
            document.getElementById('population').textContent = gameState.population;
            document.getElementById('industry').textContent = gameState.industry;
            document.getElementById('power').textContent = gameState.power;
            document.getElementById('powerNeed').textContent = gameState.powerNeed;
            document.getElementById('happiness').textContent = Math.floor(gameState.happiness);
            document.getElementById('buildingCount').textContent = gameState.buildings.length;

            // Update button states
            document.querySelectorAll('.building-btn').forEach(btn => {
                const cost = parseInt(btn.dataset.cost);
                if (gameState.money < cost || gameState.buildings.length >= 100) {
                    btn.classList.add('disabled');
                } else {
                    btn.classList.remove('disabled');
                }
            });

            // Check power status
            const powerDisplay = document.getElementById('power').parentElement;
            if (gameState.power < gameState.powerNeed) {
                powerDisplay.style.color = '#ff4444';
            } else {
                powerDisplay.style.color = '#00ff88';
            }
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Update buildings
            gameState.buildings.forEach(building => building.update());

            // Update camera
            camera.position.x = Math.sin(cameraAngle) * cameraDistance;
            camera.position.z = Math.cos(cameraAngle) * cameraDistance;
            camera.position.y = cameraDistance * 0.6;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateHUD();
        animate();
    </script>
</body>
</html>
