<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><title>Asteroid Field</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
body{margin:0;overflow:hidden;background:#000}canvas{display:block}
.hud{position:absolute;top:20px;left:20px;color:#0f8;font-family:'Courier New',monospace;font-size:14px;background:rgba(0,20,40,.8);padding:15px;border-radius:8px;border:2px solid #0f8}
.score{position:absolute;top:20px;right:20px;color:#0f8;font-family:'Courier New',monospace;font-size:20px;background:rgba(0,20,40,.8);padding:10px 20px;border-radius:8px;border:2px solid #0f8}
.gameover{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f08;font-family:'Courier New',monospace;font-size:36px;text-align:center;display:none}
</style></head><body>
<div class="hud">☄️ <strong>ASTEROID FIELD</strong><br><small>• WASD/Arrows: Move<br>• Mouse: Aim & Shoot<br>• Space: Restart</small></div>
<div class="score">Score: <span id="score">0</span> | Shield: <span id="shield">100</span>%</div>
<div class="gameover" id="gameover">GAME OVER<br><small>Press SPACE to restart</small></div>
<script>
let scene,camera,renderer,ship,asteroids=[],bullets=[],particles=[],score=0,shield=100,gameOver=false,keys={};
function init(){
    scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000011,.008);
    camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
    camera.position.set(0,30,40);camera.lookAt(0,0,0);
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    document.body.appendChild(renderer.domElement);
    // Stars
    const sg=new THREE.BufferGeometry(),sp=new Float32Array(3000);
    for(let i=0;i<3000;i++)sp[i]=(Math.random()-.5)*400;
    sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
    scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:.8,color:0xffffff})));
    // Ship
    const shipG=new THREE.ConeGeometry(.8,2,8);shipG.rotateX(Math.PI/2);
    ship=new THREE.Mesh(shipG,new THREE.MeshPhongMaterial({color:0x00ff88,emissive:0x004422}));
    scene.add(ship);
    // Lights
    scene.add(new THREE.AmbientLight(0x333333));
    const light=new THREE.PointLight(0x00ff88,1,100);light.position.set(0,20,20);scene.add(light);
    // Spawn asteroids
    for(let i=0;i<30;i++)spawnAsteroid();
    setInterval(()=>{if(!gameOver&&asteroids.length<50)spawnAsteroid()},500);
    addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')restart()});
    addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
    addEventListener('click',shoot);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    animate();
}
function spawnAsteroid(){
    const size=Math.random()*2+.5;
    const g=new THREE.DodecahedronGeometry(size,0);
    const m=new THREE.Mesh(g,new THREE.MeshPhongMaterial({color:0x888888,flatShading:true}));
    const angle=Math.random()*Math.PI*2,dist=50+Math.random()*30;
    m.position.set(Math.cos(angle)*dist,Math.random()*10-5,Math.sin(angle)*dist);
    m.userData={vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.1,vz:(Math.random()-.5)*.3,size,spin:Math.random()*.05};
    asteroids.push(m);scene.add(m);
}
function shoot(){
    if(gameOver)return;
    const g=new THREE.SphereGeometry(.15,8,8);
    const b=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x00ffff}));
    b.position.copy(ship.position);
    b.userData={vx:0,vy:0,vz:-2,life:60};
    bullets.push(b);scene.add(b);
}
function explode(pos,color=0xff8800){
    for(let i=0;i<20;i++){
        const g=new THREE.SphereGeometry(.1,4,4);
        const p=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color}));
        p.position.copy(pos);
        p.userData={vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,vz:(Math.random()-.5)*.5,life:30};
        particles.push(p);scene.add(p);
    }
}
function restart(){
    if(!gameOver)return;
    asteroids.forEach(a=>scene.remove(a));asteroids=[];
    bullets.forEach(b=>scene.remove(b));bullets=[];
    particles.forEach(p=>scene.remove(p));particles=[];
    ship.position.set(0,0,0);score=0;shield=100;gameOver=false;
    document.getElementById('gameover').style.display='none';
    for(let i=0;i<30;i++)spawnAsteroid();
}
function animate(){
    requestAnimationFrame(animate);
    if(!gameOver){
        // Ship movement
        const speed=.3;
        if(keys.w||keys.arrowup)ship.position.z-=speed;
        if(keys.s||keys.arrowdown)ship.position.z+=speed;
        if(keys.a||keys.arrowleft)ship.position.x-=speed;
        if(keys.d||keys.arrowright)ship.position.x+=speed;
        ship.position.x=Math.max(-25,Math.min(25,ship.position.x));
        ship.position.z=Math.max(-25,Math.min(25,ship.position.z));
    }
    // Update asteroids
    asteroids.forEach((a,i)=>{
        a.position.x+=a.userData.vx;a.position.y+=a.userData.vy;a.position.z+=a.userData.vz;
        a.rotation.x+=a.userData.spin;a.rotation.y+=a.userData.spin;
        // Wrap around
        if(a.position.x>60)a.position.x=-60;if(a.position.x<-60)a.position.x=60;
        if(a.position.z>60)a.position.z=-60;if(a.position.z<-60)a.position.z=60;
        // Ship collision
        if(!gameOver&&a.position.distanceTo(ship.position)<a.userData.size+1){
            shield-=20;explode(a.position,0xff0000);
            scene.remove(a);asteroids.splice(i,1);
            if(shield<=0){gameOver=true;document.getElementById('gameover').style.display='block'}
        }
    });
    // Update bullets
    bullets.forEach((b,i)=>{
        b.position.x+=b.userData.vx;b.position.z+=b.userData.vz;b.userData.life--;
        if(b.userData.life<=0){scene.remove(b);bullets.splice(i,1);return}
        // Hit asteroid
        asteroids.forEach((a,j)=>{
            if(b.position.distanceTo(a.position)<a.userData.size){
                score+=Math.round(10/a.userData.size);explode(a.position);
                scene.remove(a);asteroids.splice(j,1);
                scene.remove(b);bullets.splice(i,1);
            }
        });
    });
    // Update particles
    particles.forEach((p,i)=>{
        p.position.x+=p.userData.vx;p.position.y+=p.userData.vy;p.position.z+=p.userData.vz;
        p.userData.life--;p.scale.setScalar(p.userData.life/30);
        if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}
    });
    document.getElementById('score').textContent=score;
    document.getElementById('shield').textContent=Math.max(0,shield);
    camera.position.x+=(ship.position.x*.3-camera.position.x)*.05;
    camera.position.z+=(ship.position.z+40-camera.position.z)*.05;
    camera.lookAt(ship.position);
    renderer.render(scene,camera);
}
init();
</script></body></html>
