<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Terrain Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
        }
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="info">
        🏔️ <strong>TERRAIN EXPLORER</strong><br><br>
        <strong>Controls:</strong><br>
        WASD: Move<br>
        Mouse: Look around<br>
        Shift: Speed boost<br>
        Space: Jump<br>
        R: Regenerate terrain
    </div>
    <canvas id="minimap"></canvas>

    <script>
        let scene, camera, renderer;
        let terrain, water;
        let velocity = new THREE.Vector3();
        let keys = {};
        let mouseX = 0, mouseY = 0;
        let isPointerLocked = false;

        // Terrain settings
        const terrainSize = 100;
        const terrainSegments = 50;
        const heightScale = 10;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 20, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            createTerrain();
            createWater();
            createSky();
            createLighting();
            setupEventListeners();
            updateMinimap();

            animate();
        }

        function noise(x, y) {
            // Simple Perlin-like noise
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            const xf = x - Math.floor(x);
            const yf = y - Math.floor(y);

            const u = fade(xf);
            const v = fade(yf);

            const a = hash(X) + Y;
            const b = hash(X + 1) + Y;

            return lerp(v,
                lerp(u, grad(hash(a), xf, yf), grad(hash(b), xf - 1, yf)),
                lerp(u, grad(hash(a + 1), xf, yf - 1), grad(hash(b + 1), xf - 1, yf - 1))
            );
        }

        function fade(t) {
            return t * t * t * (t * (t * 6 - 15) + 10);
        }

        function lerp(t, a, b) {
            return a + t * (b - a);
        }

        function grad(hash, x, y) {
            const h = hash & 3;
            const u = h < 2 ? x : y;
            const v = h < 2 ? y : x;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }

        function hash(x) {
            x = ((x >> 16) ^ x) * 0x45d9f3b;
            x = ((x >> 16) ^ x) * 0x45d9f3b;
            x = (x >> 16) ^ x;
            return x;
        }

        function generateHeightmap(segments, scale, octaves = 4) {
            const heights = [];

            for (let y = 0; y <= segments; y++) {
                for (let x = 0; x <= segments; x++) {
                    let height = 0;
                    let amplitude = 1;
                    let frequency = 1;

                    for (let o = 0; o < octaves; o++) {
                        const sampleX = x / segments * scale * frequency;
                        const sampleY = y / segments * scale * frequency;
                        height += noise(sampleX, sampleY) * amplitude;
                        amplitude *= 0.5;
                        frequency *= 2;
                    }

                    heights.push(height * heightScale);
                }
            }

            return heights;
        }

        function createTerrain() {
            if (terrain) scene.remove(terrain);

            const geometry = new THREE.PlaneGeometry(
                terrainSize, terrainSize,
                terrainSegments, terrainSegments
            );

            const heights = generateHeightmap(terrainSegments, 5);
            const vertices = geometry.attributes.position.array;

            for (let i = 0; i < vertices.length; i += 3) {
                vertices[i + 2] = heights[i / 3];
            }

            geometry.computeVertexNormals();

            // Create vertex colors based on height
            const colors = [];
            for (let i = 0; i < vertices.length; i += 3) {
                const height = vertices[i + 2];
                let color;

                if (height < 2) {
                    color = new THREE.Color(0xC2B280); // Beach
                } else if (height < 5) {
                    color = new THREE.Color(0x228B22); // Grass
                } else if (height < 8) {
                    color = new THREE.Color(0x8B7355); // Rock
                } else {
                    color = new THREE.Color(0xFFFFFF); // Snow
                }

                colors.push(color.r, color.g, color.b);
            }

            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.MeshPhongMaterial({
                vertexColors: true,
                flatShading: true,
                shininess: 0
            });

            terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);
        }

        function createWater() {
            const geometry = new THREE.PlaneGeometry(terrainSize * 2, terrainSize * 2);
            const material = new THREE.MeshPhongMaterial({
                color: 0x4A90E2,
                transparent: true,
                opacity: 0.6,
                shininess: 100
            });

            water = new THREE.Mesh(geometry, material);
            water.rotation.x = -Math.PI / 2;
            water.position.y = 1;
            scene.add(water);
        }

        function createSky() {
            // Sun
            const sunGeometry = new THREE.SphereGeometry(5, 32, 32);
            const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xFFFF00 });
            const sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.position.set(50, 80, -100);
            scene.add(sun);

            // Clouds
            for (let i = 0; i < 20; i++) {
                const cloudGeometry = new THREE.SphereGeometry(5, 8, 8);
                const cloudMaterial = new THREE.MeshBasicMaterial({
                    color: 0xFFFFFF,
                    transparent: true,
                    opacity: 0.7
                });
                const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);

                cloud.position.set(
                    (Math.random() - 0.5) * 200,
                    50 + Math.random() * 30,
                    (Math.random() - 0.5) * 200
                );
                cloud.scale.set(
                    1 + Math.random() * 2,
                    0.5 + Math.random() * 0.5,
                    1 + Math.random() * 2
                );

                scene.add(cloud);
            }
        }

        function createLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 80, -100);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            scene.add(directionalLight);
        }

        function setupEventListeners() {
            document.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                if (e.key.toLowerCase() === 'r') createTerrain();
            });

            document.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });

            document.addEventListener('click', () => {
                renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = document.pointerLockElement === renderer.domElement;
            });

            document.addEventListener('mousemove', (e) => {
                if (isPointerLocked) {
                    mouseX -= e.movementX * 0.002;
                    mouseY -= e.movementY * 0.002;
                    mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
                }
            });

            window.addEventListener('resize', onResize);
        }

        function updateMovement() {
            const speed = keys['shift'] ? 0.5 : 0.2;
            const forward = new THREE.Vector3(0, 0, -1);
            const right = new THREE.Vector3(1, 0, 0);

            forward.applyQuaternion(camera.quaternion);
            right.applyQuaternion(camera.quaternion);

            forward.y = 0;
            right.y = 0;
            forward.normalize();
            right.normalize();

            if (keys['w']) velocity.add(forward.multiplyScalar(speed));
            if (keys['s']) velocity.add(forward.multiplyScalar(-speed));
            if (keys['a']) velocity.add(right.multiplyScalar(-speed));
            if (keys['d']) velocity.add(right.multiplyScalar(speed));
            if (keys[' ']) velocity.y += 0.3;

            // Apply gravity
            velocity.y -= 0.02;

            // Apply friction
            velocity.x *= 0.9;
            velocity.z *= 0.9;
            velocity.y *= 0.98;

            camera.position.add(velocity);

            // Terrain collision
            if (camera.position.y < 5) {
                camera.position.y = 5;
                velocity.y = 0;
            }

            // Camera rotation
            camera.quaternion.setFromEuler(new THREE.Euler(mouseY, mouseX, 0, 'YXZ'));
        }

        function updateMinimap() {
            const canvas = document.getElementById('minimap');
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 150, 150);

            // Draw terrain on minimap
            ctx.fillStyle = '#228B22';
            ctx.fillRect(10, 10, 130, 130);

            // Draw player position
            const playerX = (camera.position.x / terrainSize + 0.5) * 130 + 10;
            const playerZ = (camera.position.z / terrainSize + 0.5) * 130 + 10;

            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(playerX, playerZ, 5, 0, Math.PI * 2);
            ctx.fill();

            // Draw direction
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(playerX, playerZ);
            ctx.lineTo(
                playerX + Math.sin(mouseX) * 10,
                playerZ - Math.cos(mouseX) * 10
            );
            ctx.stroke();
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            updateMovement();
            updateMinimap();

            // Animate water
            water.material.opacity = 0.6 + Math.sin(Date.now() * 0.001) * 0.1;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
