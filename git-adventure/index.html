<body>
    <canvas id="bg-canvas"></canvas>

    <div class="stats-bar">
        <div class="stat">
            <span class="stat-label">Level:</span>

        <div class="stat">

            <span class="stat-value" id="xp">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Branch:</span>
            <span class="stat-value good" id="branch">main</span>

    </div>

    <div class="game-container">
        <div class="terminal">
            <div class="terminal-header">
                <div class="terminal-btn red"></div>
                <div class="terminal-btn yellow"></div>
                <div class="terminal-btn green"></div>
                <div class="terminal-title">git-adventure — bash</div>
            </div>
            <div class="terminal-body" id="terminal-body">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Three.js Background - Git commit graph style
        let scene, camera, renderer;
        const commits = [];
        const branches = [];

        function initBackground() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);

            // Create commit nodes
            const colors = [0x3fb950, 0x58a6ff, 0xa371f7, 0xf85149];

            for (let i = 0; i < 40; i++) {
                const geometry = new THREE.OctahedronGeometry(0.5, 0);
                const material = new THREE.MeshBasicMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    wireframe: true
                });
                const commit = new THREE.Mesh(geometry, material);

                commit.position.set(
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 60,
                    (Math.random() - 0.5) * 20
                );
                commit.userData = {
                    vx: (Math.random() - 0.5) * 0.03,
                    vy: -0.02 - Math.random() * 0.02,
                    rotSpeed: (Math.random() - 0.5) * 0.02
                };
                commits.push(commit);
                scene.add(commit);
            }

            // Create branch lines
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0x30363d,
                transparent: true,
                opacity: 0.3
            });

            for (let i = 0; i < 8; i++) {
                const points = [];
                const x = (i - 4) * 12;
                for (let y = -40; y < 40; y += 5) {
                    points.push(new THREE.Vector3(x + Math.sin(y * 0.1) * 3, y, -10));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, lineMaterial);
                branches.push(line);
                scene.add(line);
            }

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            commits.forEach(commit => {
                commit.position.y += commit.userData.vy;
                commit.position.x += commit.userData.vx;
                commit.rotation.x += commit.userData.rotSpeed;
                commit.rotation.y += commit.userData.rotSpeed;

                // Reset when off screen
                if (commit.position.y < -35) {
                    commit.position.y = 35;
                    commit.position.x = (Math.random() - 0.5) * 100;
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

                <p>Most devs think GitHub Pages is for documentation. They're missing out. You can host entire web applications - games, tools, portfolios - for FREE. No servers. No deployment pipelines. Just push and it's live.</p>
                <p>Ready to level up?</p>`,
                choices: [
                    { text: "Show me how to enable GitHub Pages", goto: "enable_pages", page: 2 },
                    { text: "What can I actually build with this?", goto: "what_to_build", page: 3 }
                ]
            },

            enable_pages: {
                page: 2,
                title: "Enabling GitHub Pages",
                icon: "⚙️",

                <div class="code-block">

                <p>This is exactly how this games site works - each game is a folder with a self-contained index.html.</p>`,
                choices: [

        // Game State
        let currentPage = 'start';
        let visitedPages = new Set();
        let xp = 0;
        const levels = ['Noob', 'Beginner', 'Developer', 'Hacker', 'Master'];

        function getLevel() {
            if (xp < 20) return 0;
            if (xp < 40) return 1;
            if (xp < 60) return 2;
            if (xp < 80) return 3;
            return 4;
        }

        function renderPage(pageId) {
            const page = story[pageId];
            currentPage = pageId;

            if (!visitedPages.has(pageId)) {
                visitedPages.add(pageId);
                xp = Math.min(100, xp + 8);
            }

            // Update stats
            const level = getLevel();
            document.getElementById('xp').textContent = xp;
            document.getElementById('xp-fill').style.width = xp + '%';
            document.getElementById('level').textContent = levels[level];
            document.getElementById('branch').textContent = page.ending ? 'shipped!' : 'main';

            // Flash commits in background
            commits.forEach(c => {
                c.material.color.setHex(0xffffff);
                setTimeout(() => {
                    c.material.color.setHex([0x3fb950, 0x58a6ff, 0xa371f7][Math.floor(Math.random() * 3)]);
                }, 150);
            });

            let html = `<div class="page-indicator">Page ${page.page} of 15</div>`;
            html += `<h2 class="chapter-title"><span class="icon">${page.icon}</span>${page.title}</h2>`;

            if (page.concept) {
                html += `<div class="concept-box">
                    <div class="label">Key Concept</div>
                    <div class="term">${page.concept.term}</div>
                    <div class="definition">${page.concept.definition}</div>
                </div>`;
            }

            html += `<div class="story-text">${page.text}</div>`;

            if (page.ending) {
                html += `<div class="ending ${page.endingType}">
                    <div class="badge ${page.endingType}">
                        <div class="badge-title">${page.title}</div>
                        <div class="badge-subtitle">Achievement Unlocked</div>
                    </div>
                    <div class="skills-learned">
                        <h3>Skills Acquired:</h3>
                        <ul>
                            ${page.skills.map(s => `<li>${s}</li>`).join('')}
                        </ul>
                    </div>
                    <button class="restart-btn" onclick="restartGame()">New Journey</button>
                </div>`;
            } else {
                html += `<div class="choices">
                    <div class="choices-header">Choose Your Path</div>
                    ${page.choices.map(choice =>
                        `<button class="choice-btn" onclick="renderPage('${choice.goto}')">
                            <span class="prompt">$</span>${choice.text}
                            <span class="page-ref">→ pg ${choice.page}</span>
                        </button>`
                    ).join('')}
                </div>`;
            }

            document.getElementById('terminal-body').innerHTML = html;
            document.querySelector('.terminal').scrollTop = 0;
            window.scrollTo(0, 0);
        }

        function restartGame() {
            visitedPages.clear();
            xp = 0;
            renderPage('start');
        }

        // Init
        initBackground();
        renderPage('start');
