<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GitPhuckt - Master GitHub Pages</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="stats-bar">
        <div class="stat">
            <span class="stat-label">Level:</span>
            <span class="stat-value" id="level">Noob</span>
        </div>
        <div class="stat">
            <span class="stat-label">XP:</span>
            <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
            <span class="stat-value" id="xp">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">Branch:</span>
            <span class="stat-value good" id="branch">main</span>
        </div>
    </div>

    <div class="game-container">
        <div class="terminal">
            <div class="terminal-header">
                <div class="terminal-btn red"></div>
                <div class="terminal-btn yellow"></div>
                <div class="terminal-btn green"></div>
                <div class="terminal-title">git-adventure — bash</div>
            </div>
            <div class="terminal-body" id="terminal-body"></div>
        </div>
    </div>

    <script src="story.js"></script>
    <script src="story-intro.js"></script>
    <script src="story-core.js"></script>
    <script src="story-advanced.js"></script>
    <script src="story-endings.js"></script>
    <script src="background.js"></script>
    <script src="game.js"></script>
</body>
</html>
