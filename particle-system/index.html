<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Particle Storm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: rgba(0, 20, 40, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #00ff88;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            background: rgba(0, 20, 40, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #00ff88;
        }
    </style>
</head>
<body>
    <div id="info">
        ✨ <strong>PARTICLE STORM</strong><br>
        <small>
        • Move mouse: Attract particles<br>
        • Click: Explosion<br>
        • 1-5: Change modes<br>
        • Space: Reset
        </small>
    </div>
    <div id="stats">Particles: <span id="count">0</span> | Mode: <span id="mode">Attract</span></div>

    <script>
        let scene, camera, renderer;
        let particles, particleCount = 5000;
        let positions, velocities, colors;
        let mouse = new THREE.Vector3();
        let raycaster = new THREE.Raycaster();
        let mouseVector = new THREE.Vector2();
        let mode = 'attract'; // attract, repel, orbit, chaos, wave

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            createParticles();

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', onMouseClick);
            document.addEventListener('keydown', onKeyDown);
            window.addEventListener('resize', onResize);

            updateStats();
            animate();
        }

        function createParticles() {
            const geometry = new THREE.BufferGeometry();

            positions = new Float32Array(particleCount * 3);
            velocities = new Float32Array(particleCount * 3);
            colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                // Position
                positions[i3] = (Math.random() - 0.5) * 100;
                positions[i3 + 1] = (Math.random() - 0.5) * 100;
                positions[i3 + 2] = (Math.random() - 0.5) * 50;

                // Velocity
                velocities[i3] = (Math.random() - 0.5) * 0.5;
                velocities[i3 + 1] = (Math.random() - 0.5) * 0.5;
                velocities[i3 + 2] = (Math.random() - 0.5) * 0.5;

                // Color
                const hue = Math.random();
                const color = new THREE.Color().setHSL(hue, 1.0, 0.5);
                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function onMouseMove(event) {
            mouseVector.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouseVector.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouseVector, camera);

            const distance = -camera.position.z / raycaster.ray.direction.z;
            mouse.copy(raycaster.ray.direction).multiplyScalar(distance).add(camera.position);
        }

        function onMouseClick() {
            // Explosion effect
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const dx = positions[i3] - mouse.x;
                const dy = positions[i3 + 1] - mouse.y;
                const dz = positions[i3 + 2] - mouse.z;
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (distance < 20) {
                    const force = (20 - distance) / 20;
                    velocities[i3] += (dx / distance) * force * 5;
                    velocities[i3 + 1] += (dy / distance) * force * 5;
                    velocities[i3 + 2] += (dz / distance) * force * 5;
                }
            }
        }

        function onKeyDown(event) {
            if (event.code === 'Space') {
                resetParticles();
            } else if (event.code === 'Digit1') {
                mode = 'attract';
                updateStats();
            } else if (event.code === 'Digit2') {
                mode = 'repel';
                updateStats();
            } else if (event.code === 'Digit3') {
                mode = 'orbit';
                updateStats();
            } else if (event.code === 'Digit4') {
                mode = 'chaos';
                updateStats();
            } else if (event.code === 'Digit5') {
                mode = 'wave';
                updateStats();
            }
        }

        function resetParticles() {
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                positions[i3] = (Math.random() - 0.5) * 100;
                positions[i3 + 1] = (Math.random() - 0.5) * 100;
                positions[i3 + 2] = (Math.random() - 0.5) * 50;
                velocities[i3] = 0;
                velocities[i3 + 1] = 0;
                velocities[i3 + 2] = 0;
            }
        }

        function updateStats() {
            document.getElementById('count').textContent = particleCount;
            document.getElementById('mode').textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
        }

        function updateParticles() {
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                const dx = mouse.x - positions[i3];
                const dy = mouse.y - positions[i3 + 1];
                const dz = mouse.z - positions[i3 + 2];
                const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                if (mode === 'attract' && distance > 1) {
                    const force = 0.05 / distance;
                    velocities[i3] += dx * force;
                    velocities[i3 + 1] += dy * force;
                    velocities[i3 + 2] += dz * force;
                } else if (mode === 'repel' && distance < 30) {
                    const force = 0.5 / (distance + 1);
                    velocities[i3] -= dx * force;
                    velocities[i3 + 1] -= dy * force;
                    velocities[i3 + 2] -= dz * force;
                } else if (mode === 'orbit') {
                    const angle = Math.atan2(dy, dx);
                    velocities[i3] += -Math.sin(angle) * 0.1;
                    velocities[i3 + 1] += Math.cos(angle) * 0.1;
                } else if (mode === 'chaos') {
                    velocities[i3] += (Math.random() - 0.5) * 0.2;
                    velocities[i3 + 1] += (Math.random() - 0.5) * 0.2;
                    velocities[i3 + 2] += (Math.random() - 0.5) * 0.2;
                } else if (mode === 'wave') {
                    const time = Date.now() * 0.001;
                    velocities[i3 + 1] += Math.sin(time + positions[i3] * 0.1) * 0.05;
                }

                // Apply velocity
                positions[i3] += velocities[i3];
                positions[i3 + 1] += velocities[i3 + 1];
                positions[i3 + 2] += velocities[i3 + 2];

                // Damping
                velocities[i3] *= 0.98;
                velocities[i3 + 1] *= 0.98;
                velocities[i3 + 2] *= 0.98;

                // Boundaries
                if (Math.abs(positions[i3]) > 50) velocities[i3] *= -0.5;
                if (Math.abs(positions[i3 + 1]) > 50) velocities[i3 + 1] *= -0.5;
                if (Math.abs(positions[i3 + 2]) > 25) velocities[i3 + 2] *= -0.5;

                // Update colors based on velocity
                const speed = Math.sqrt(
                    velocities[i3] * velocities[i3] +
                    velocities[i3 + 1] * velocities[i3 + 1] +
                    velocities[i3 + 2] * velocities[i3 + 2]
                );
                const hue = (speed * 0.5) % 1;
                const color = new THREE.Color().setHSL(hue, 1.0, 0.5);
                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            updateParticles();

            camera.position.x += (mouse.x * 0.1 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y * 0.1 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
